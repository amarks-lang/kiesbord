<!--
=====================================================================
 KEUZEBORD – digitaal keuzebord voor groep 1/2          (één bestand)
=====================================================================
 FIREBASE OPZETTEN (eenmalig, ±10 minuten)
 1. Ga naar https://console.firebase.google.com en maak een project.
    Zet Google Analytics UIT (deze app gebruikt geen analytics).
 2. Build > Authentication > Aan de slag > Sign-in method:
    zet "Google" én "E-mail/wachtwoord" aan.
 3. Build > Firestore Database > Database maken > locatie
    "europe-west4 (Netherlands)" > productiemodus.
 4. Firestore > tabblad Regels: plak de inhoud van firestore.rules
    en klik op Publiceren.
 5. Authentication > Instellingen > Geautoriseerde domeinen: voeg het
    domein toe waarop deze pagina staat (bijv. jouwnaam.github.io).
 6. Projectinstellingen (tandwiel) > Jouw apps > Web-app (</>) toevoegen.
    Kopieer de waarden naar het blok firebaseConfig hieronder.
 7. Open de pagina en log in. De eerste gebruiker wordt beheerder en
    maakt via een korte wizard de school en de eerste klas aan.
    Collega's koppel je daarna bij Instellingen > Beheer (op e-mailadres).

 PROBEERMODUS: zolang firebaseConfig niet is ingevuld draait de app
 zonder Firebase en staat alles alleen in deze browser (localStorage).
 Handig om te testen: Instellingen > "Demo-data laden".

 DATAMODEL (Firestore)
 gebruikers/{uid}            rol, schoolId, klasIds[], email
 uitnodigingen/{email}       rol, schoolId, klasIds[]  (collega koppelen)
 scholen/{schoolId}          naam
 scholen/{s}/klassen/{k}     naam, pinHash, categorieen[], keuzebordId, geluid,
                             toonTeller, dagkleuren[]
   kinderen/{id}             naam, symbool, foto, actief, teller{actId:n}
   activiteiten/{id}         naam, plaatje, foto, plekken, kleur,
                             categorie, beschrijving   (de bibliotheek)
   keuzeborden/{id}          naam, beschrijving, items[{a, plekken, kleur}]
                             (a=activiteitId; een selectie, bijv. per thema)
   bord/stand                rondeId, plaatsen{kindId:{a,s,k}}
                             (a=activiteitId, s=start, k=keuzeId)
   keuzes/{id}               kindId, activiteitId, start, eind,
                             rondeId, datum
   moetjes/{id}              datum, totDatum, activiteitId, heleGroep,
                             kindIds[], afgerond[], planning{kindId:dag}
 Ruimte voor later: activiteiten.doelen[] (SLO), keuzes.reflectie
 (smiley), klassen.lokaal / gedeelde activiteiten (groepsdoorbroken),
 collecties weekplan/ en jaarplan/ naast moetjes/.
=====================================================================
-->

<script type="module">

const $ = (s, el = document) => el.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nieuwId = () => Array.from(crypto.getRandomValues(new Uint8Array(15)), b => 'abcdefghijklmnopqrstuvwxyz0123456789'[b % 36]).join('');
const dagStr = (t = Date.now()) => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const zonderId = o => { const { id, ...r } = o || {}; return r; };
const opNaam = (a, b) => a.naam.localeCompare(b.naam, 'nl');
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => el.style.display = 'none', 3500); }
async function hash(t) {
  if (crypto.subtle) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  let h = 5381; for (const c of t) h = (h * 33 ^ c.charCodeAt(0)) >>> 0; return 'x' + h;
}

const SYMBOLEN = '🐶 🐱 🐭 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵 🐔 🐧 🦆 🦉 🦄 🐝 🦋 🐞 🐢 🐠 🐬 🐳 🦖 🐘 🦒 🦔 🚗 🚀 ⚽ 🎈 🌈 ⭐ 🌻 🍎 🍓 ☂️'.split(' ');
const KLEUREN = ['#f8b4b4', '#fbd38d', '#faf089', '#9ae6b4', '#81e6d9', '#90cdf4', '#a3bffa', '#d6bcfa', '#fbb6ce', '#cbd5e0'];
const DAGNAMEN = ['ma', 'di', 'wo', 'do', 'vr'];
const DAGKLEUREN = ['#e85d5d', '#f2c94c', '#6fcf97', '#56a8e8', '#b07cd8']; // ma rood, di geel, wo groen, do blauw, vr paars (aanpasbaar bij Instellingen)
const CATS = ['Constructief/motoriek', 'Creatief', 'Overig', 'Rekenen', 'Spel', 'Taal'];
// naam, plaatje, plekken, kleurindex, categorie-index (de eerste 20 staan op het standaard-keuzebord)
const STANDAARD = [
  ['Bouwhoek', '🧱', 4, 1, 0], ['Huishoek', '🏠', 4, 8, 4], ['Zandtafel', '🏖️', 3, 2, 0], ['Watertafel', '💧', 3, 5, 2], ['Verven', '🎨', 2, 0, 1],
  ['Tekenen', '✏️', 4, 6, 1], ['Knutselen', '✂️', 4, 7, 1], ['Kleien', '🏺', 4, 1, 0], ['Puzzelen', '🧩', 4, 3, 3], ['Leeshoek', '📚', 3, 4, 5],
  ['Computer', '💻', 2, 9, 2], ['Constructie', '🔩', 4, 5, 0], ['Kralen', '📿', 3, 8, 0], ['Spelletjes', '🎲', 4, 0, 4], ['Letterhoek', '🔤', 3, 6, 5],
  ['Rekenhoek', '🔢', 3, 3, 3], ['Poppenkast', '🎭', 3, 7, 4], ['Treinbaan', '🚂', 3, 2, 0], ['Ontdekhoek', '🔍', 3, 4, 2], ['Muziek', '🎵', 2, 9, 1],
  ['Herfsttafel', '🍂', 3, 1, 2], ['Sneeuwhoek', '⛄', 3, 5, 2], ['Moestuin', '🌱', 3, 3, 2], ['Waterbaan', '🚿', 3, 4, 0], ['Winkeltje', '🛒', 4, 0, 4],
  ['Schrijfhoek', '📝', 2, 6, 5], ['Lettertafel', '🔠', 3, 4, 5], ['Telhoek', '🧮', 3, 3, 3], ['Motoriekhoek', '🤸', 4, 7, 0], ['Bij de juf', '👩‍🏫', 4, 9, 2],
];
const standaardOps = basis => [
  ...STANDAARD.map(([naam, plaatje, plekken, k, c], i) => ({ p: `${basis}/activiteiten/std${i}`, d: { naam, plaatje, foto: '', plekken, kleur: KLEUREN[k], categorie: CATS[c], beschrijving: '' } })),
  { p: `${basis}/keuzeborden/standaard`, d: { naam: 'Standaard', beschrijving: '', items: STANDAARD.slice(0, 20).map((s, i) => ({ a: 'std' + i })) }, merge: false },
];

// ====================================================================
//  Datalaag: Firestore (FS) of probeermodus in localStorage (LS)
//  Paden zijn strings: oneven aantal delen = collectie, even = document
// ====================================================================
const cfg = window.firebaseConfig || {};
const LOKAAL = !cfg.apiKey || !cfg.projectId;
const isCol = p => p.split('/').length % 2 === 1;
let fb = null, DB = null;

const FS = {
  ref(p) { const s = p.split('/'); return s.length % 2 ? fb.collection(fb.db, ...s) : fb.doc(fb.db, ...s); },
  sub(p, cb) {
    const fout = e => console.warn('sync', p, e.code || e);
    return isCol(p) ? fb.onSnapshot(this.ref(p), s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), fout)
      : fb.onSnapshot(this.ref(p), s => cb(s.exists() ? { id: s.id, ...s.data() } : null), fout);
  },
  async get(p) { const s = await fb.getDoc(this.ref(p)); return s.exists() ? { id: s.id, ...s.data() } : null; },
  async list(p, veld, a, b) {
    let q = this.ref(p);
    if (veld && b !== undefined) q = fb.query(q, fb.where(veld, '>=', a), fb.where(veld, '<=', b));
    else if (veld) q = fb.query(q, fb.where(veld, '==', a));
    return (await fb.getDocs(q)).docs.map(d => ({ id: d.id, ...d.data() }));
  },
  put(p, d, merge = true) { return fb.setDoc(this.ref(p), d, { merge }); },
  del(p) { return fb.deleteDoc(this.ref(p)); },
  async batch(ops) {
    for (let i = 0; i < ops.length; i += 400) {
      const b = fb.writeBatch(fb.db);
      for (const o of ops.slice(i, i + 400)) o.del ? b.delete(this.ref(o.p)) : b.set(this.ref(o.p), o.d, { merge: o.merge !== false });
      const klaar = b.commit(); if (navigator.onLine) await klaar; else klaar.catch(() => { });
    }
  },
  tx(p, fn) {
    return fb.runTransaction(fb.db, async t => {
      const s = await t.get(this.ref(p)); const r = fn(s.exists() ? s.data() : null);
      t.set(this.ref(p), r.doc); for (const o of r.ops || []) t.set(this.ref(o.p), o.d, { merge: true });
      return r;
    });
  },
  inc: n => fb.increment(n), union: v => fb.arrayUnion(v), remove: v => fb.arrayRemove(v),
};

const LS = {
  data: (() => { try { return JSON.parse(localStorage.getItem('keuzebord_lokaal') || '{}'); } catch (e) { return {}; } })(),
  subs: new Set(), bezig: false,
  meld() {
    if (this.bezig) return; this.bezig = true;
    setTimeout(() => { this.bezig = false; try { localStorage.setItem('keuzebord_lokaal', JSON.stringify(this.data)); } catch (e) { toast('Opslag in de browser is vol'); } for (const f of [...this.subs]) f(); }, 0);
  },
  een(p) { return this.data[p] ? { id: p.split('/').pop(), ...structuredClone(this.data[p]) } : null; },
  alle(p) { const pre = p + '/'; return Object.keys(this.data).filter(k => k.startsWith(pre) && !k.slice(pre.length).includes('/')).map(k => this.een(k)); },
  sub(p, cb) { const f = () => cb(isCol(p) ? this.alle(p) : this.een(p)); this.subs.add(f); setTimeout(f, 0); return () => this.subs.delete(f); },

function stopSubs() { S.unsubs.forEach(f => f()); S.unsubs = []; S.klaar = {}; S.klas = null; }

function ververs(wat) {

// ====================================================================
//  Het bord
// ====================================================================
const grid = $('#grid'), bak = $('#bak'), dagen = $('#dagen');
const cats = () => S.klas?.categorieen?.length ? S.klas.categorieen : CATS;
const actiefBord = () => S.borden.find(b => b.id === S.klas?.keuzebordId) || null;
// de activiteiten op het actieve keuzebord (met de kleur en het aantal plekken van dát bord); zonder keuzebord: alle activiteiten
function zichtbaar() {
  const b = actiefBord(); if (!b) return S.acts.filter(a => a.actief !== false);
  return (b.items || []).map(it => { const a = S.acts.find(x => x.id === it.a); return a && { ...a, plekken: it.plekken || a.plekken, kleur: it.kleur || a.kleur }; }).filter(Boolean);
}
const plaats = id => id in S.wacht ? S.wacht[id] : (S.stand.plaatsen?.[id]?.a || null);
const moetjesNu = () => { const d = dagStr(); return S.moetjes.filter(m => m.datum <= d && (m.totDatum || m.datum) >= d); };
const moetjesVan = id => moetjesNu().filter(m => (m.heleGroep || (m.kindIds || []).includes(id)) && !(m.afgerond || []).includes(id));
const plaatje = (o, veld) => o.foto ? `<img src="${o.foto}" alt="">` : `<span>${esc(o[veld] || '❓')}</span>`;

function chip(k, actId) {
  const dk = dagkleuren();
  const mt = moetjesVan(k.id).slice(0, 2).map(m => { const a = S.acts.find(x => x.id === m.activiteitId); const dg = m.planning?.[k.id]; return a ? `<span class="mt" style="${dg != null ? `--dk:${dk[dg]}` : ''}">${a.foto ? '📌' : esc(a.plaatje)}</span>` : ''; }).join('');
  const tl = actId && S.klas.toonTeller ? `<span class="tl">${k.teller?.[actId] || 0}</span>` : '';
  const g = S.ghost === k.id || sl?.kind === k.id ? ' ghost' : '';
  return `<div class="chip${g}" data-kind="${k.id}">${k.foto ? `<img class="sym" src="${k.foto}" alt="">` : `<span class="sym">${esc(k.symbool || '🙂')}</span>`}<span class="nm">${esc(k.naam)}</span>${mt}${tl}</div>`;
}

function renderBord() {
  if (!S.klas) return;
  const acts = zichtbaar(), ids = new Set(acts.map(a => a.id)), kids = S.kids.filter(k => k.actief !== false), per = {}, los = [];
  for (const k of kids) { const a = plaats(k.id); if (a && ids.has(a)) (per[a] ||= []).push(k); else los.push(k); }
  grid.innerHTML = acts.map(a => {
    const ks = per[a.id] || [], vrij = Math.max(0, a.plekken - ks.length);
    return `<div class="act${vrij ? '' : ' vol'}" data-act="${a.id}" style="--kl:${a.kleur || '#cbd5e0'}"><div class="pl">${plaatje(a, 'plaatje')}<b>${esc(a.naam)}</b></div><div class="slots">${ks.map(k => chip(k, a.id)).join('')}${'<i class="slot"></i>'.repeat(vrij)}</div></div>`;
  }).join('') || '<p style="margin:auto">Dit keuzebord is nog leeg. Houd het tandwiel 3 seconden ingedrukt.</p>';
  bak.innerHTML = los.map(k => chip(k)).join('');
  bak.dataset.n = kids.length;
  const dk = dagkleuren(), nu = vandaagIdx();
  dagen.classList.toggle('aan', moetjesNu().length > 0);
  dagen.innerHTML = dk.map((c, i) => `<div class="dag${i === nu ? ' nu' : ''}" data-dag="${i}" style="--dk:${c}" title="${DAGNAMEN[i]}"></div>`).join('');
  pasAan();
}

// grootste vierkant waarmee n vakjes in w×h passen
function best(n, w, h, g) { let s = 0; for (let c = 1; c <= n; c++) { const r = Math.ceil(n / c); s = Math.max(s, Math.min((w - g * (c - 1)) / c, (h - g * (r - 1)) / r)); } return Math.max(0, Math.floor(s)); }
function pasAan() {
  const n = grid.querySelectorAll('.act').length; if (!n || !grid.clientWidth) return;
  const W = grid.clientWidth, H = grid.clientHeight, g = 10; let bc = 1, bs = 0;
  for (let c = 1; c <= n; c++) { const r = Math.ceil(n / c), w = (W - g * (c - 1)) / c, h = (H - g * (r - 1)) / r, sc = Math.min(w / 1.8, h); if (sc > bs) { bs = sc; bc = c; } }
  grid.style.gridTemplateColumns = `repeat(${bc},minmax(0,1fr))`; grid.style.gridTemplateRows = `repeat(${Math.ceil(n / bc)},minmax(0,1fr))`;
  const maten = [...grid.querySelectorAll('.slots')].map(sl => [sl, best(sl.children.length, sl.clientWidth - 2, sl.clientHeight - 2, 6)]);
  for (const [sl, m] of maten) sl.style.setProperty('--chip', m + 'px');
  const oh = $('#onder').clientHeight;
  dagen.style.setProperty('--d', Math.floor(Math.min(64, (oh - 24 - 4 * 6) / 5)) + 'px');
  bak.style.setProperty('--chip', Math.min(150, best(Math.max(+bak.dataset.n || 1, 1), bak.clientWidth - 16, bak.clientHeight - 16, 8)) + 'px');
}
new ResizeObserver(() => pasAan()).observe($('#bord'));

// ---------- geluid ----------
let ac;
function geluid() {
  if (S.klas.geluid === false) return;
  try {
    ac ||= new (window.AudioContext || window.webkitAudioContext)();
    [523, 659, 784].forEach((f, i) => { const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * .09; o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(.25, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + .25); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + .3); });
  } catch (e) { }
}

// ---------- kiezen (transactie: een hoek raakt nooit voller dan het maximum) ----------
async function kies(kindId, actId) {
  const nu = Date.now(), pad = K('bord/stand');
  S.wacht[kindId] = actId; renderBord();
  const bouw = stand => {
    stand = zonderId(stand || { plaatsen: {}, rondeId: nieuwId() });
    const pl = { ...(stand.plaatsen || {}) }, oud = pl[kindId], ops = [];
    if (actId) {
      const act = zichtbaar().find(a => a.id === actId), bezet = Object.entries(pl).filter(([k, v]) => v.a === actId && k !== kindId).length;
      if (!act || bezet >= act.plekken) throw new Error('vol');
    }
    if (oud?.a === actId) return { doc: stand, ops: [], zelfde: true };
    if (oud) ops.push({ p: K('keuzes/' + oud.k), d: { eind: nu } });
    if (actId) { const kid = nieuwId(); pl[kindId] = { a: actId, s: nu, k: kid }; ops.push({ p: K('keuzes/' + kid), d: { kindId, activiteitId: actId, start: nu, eind: null, rondeId: stand.rondeId, datum: dagStr(nu) } }); }
    else delete pl[kindId];
    return { doc: { ...stand, plaatsen: pl }, ops };
  };
  let r;
  try {
    if (!navigator.onLine) throw new Error('offline');
    r = await Promise.race([DB.tx(pad, bouw), new Promise((_, nee) => setTimeout(() => nee(new Error('traag')), 6000))]);
  } catch (e) {
    try {
      if (e.message === 'vol') throw e;
      // offline of haperend netwerk: schrijf direct; Firestore synchroniseert zodra er weer verbinding is
      r = bouw(S.stand); DB.batch([{ p: pad, d: r.doc, merge: false }, ...r.ops]).catch(console.warn);
    } catch (e2) { delete S.wacht[kindId]; renderBord(); return; }
  }
  S.stand = { ...r.doc }; delete S.wacht[kindId];
  if (actId && !r.zelfde) {
    geluid();
    DB.put(K('kinderen/' + kindId), { teller: { [actId]: DB.inc(1) } }).catch(console.warn);
    for (const m of moetjesVan(kindId)) if (m.activiteitId === actId) DB.put(K('moetjes/' + m.id), { afgerond: DB.union(kindId) }).catch(console.warn);
  }
  renderBord();
}

function opruimen() {
  const nu = Date.now(), ops = Object.values(S.stand.plaatsen || {}).map(v => ({ p: K('keuzes/' + v.k), d: { eind: nu } }));
  const doc = { plaatsen: {}, rondeId: nieuwId(), vorigeRonde: nu };
  ops.push({ p: K('bord/stand'), d: doc, merge: false });
  DB.batch(ops).catch(console.warn); S.stand = doc; S.wacht = {}; renderBord(); toast('Opgeruimd! Nieuwe ronde 🧹');
}

function planDag(kindId, dag) {
  const ms = moetjesVan(kindId); if (!ms.length) return false;
  for (const m of ms) DB.put(K('moetjes/' + m.id), { planning: { [kindId]: dag } }).catch(console.warn);
  return true;
}

// ---------- slepen met Pointer Events ----------
let sl = null;
$('#bord').addEventListener('pointerdown', e => {
  const bron = e.target.closest('.chip,.dag'); if (!bron || sl || e.button > 0) return;
  e.preventDefault();
  const r = bron.getBoundingClientRect(), kl = bron.cloneNode(true);
  kl.classList.add('vlieg'); kl.classList.remove('ghost');
  Object.assign(kl.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
  kl.style.setProperty('--chip', r.width + 'px'); kl.style.setProperty('--d', r.width + 'px');
  document.body.append(kl);
  sl = { kl, r, dx: e.clientX - r.left, dy: e.clientY - r.top, kind: bron.dataset.kind, dag: bron.dataset.dag, id: e.pointerId };
  if (sl.kind) bron.classList.add('ghost');
  beweeg(e);
});
function beweeg(e) {
  if (!sl || e.pointerId !== sl.id) return;
  sl.kl.style.transform = `translate(${e.clientX - sl.dx - sl.r.left}px,${e.clientY - sl.dy - sl.r.top}px) scale(1.12)`;
  const doel = sl.kind ? document.elementFromPoint(e.clientX, e.clientY)?.closest('.act:not(.vol)') : null;
  grid.querySelectorAll('.act.doel').forEach(a => a !== doel && a.classList.remove('doel')); doel?.classList.add('doel');
}
function terug() {
  const s = sl; sl = null; if (!s) return; S.ghost = s.kind || null;

function houdIn(el, ms, fn) {
  let t; const stop = () => { clearTimeout(t); el.classList.remove('houd'); };
  el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); el.style.setProperty('--ms', ms + 'ms'); el.classList.add('houd'); t = setTimeout(() => { stop(); fn(); }, ms); });
  for (const k of ['pointerup', 'pointerleave', 'pointercancel']) el.addEventListener(k, stop);
}

// ---------- foto's: verkleinen naar max 400px, JPEG 70%, base64 ----------
function leesFoto(file) {
  return new Promise((ok, nee) => {
    const img = new Image();
    img.onload = () => { const s = Math.min(1, 400 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src); ok(c.toDataURL('image/jpeg', .7)); };
    img.onerror = nee; img.src = URL.createObjectURL(file);
  });
}
function teGroot(obj) { // Firestore-document mag maximaal 1 MiB zijn
  const n = JSON.stringify(obj).length;
  if (n > 900000) { alert('Dit document wordt te groot voor Firestore (max. 1 MB). Kies een kleinere foto.'); return true; }
  if (n > 250000) toast('Let op: deze foto is vrij groot (' + Math.round(n / 1024) + ' kB)');
  return false;
}
function fotoVeld(d, o) {
  const toon = () => $('#f-prev', d).innerHTML = o.foto ? `<div class="rij"><img src="${o.foto}" style="width:70px;height:70px;object-fit:cover;border-radius:14px" alt=""><button type="button" class="klein" id="f-weg">Foto weghalen</button></div>` : '';
  toon();
  $('#f-foto', d).onchange = async e => { try { o.foto = await leesFoto(e.target.files[0]); toon(); } catch (x) { toast('Deze foto kan niet gelezen worden'); } };
  $('#f-prev', d).onclick = e => { if (e.target.id === 'f-weg') { o.foto = ''; toon(); } };
}

function sorteerbaar(lijst, klaar) {

    if (!e.target.closest('.greep')) return; e.preventDefault();
    const rij = e.target.closest('.arij'); rij.classList.add('sleep'); sorteert = true;
    const mv = ev => { const na = [...lijst.querySelectorAll('.arij:not(.sleep)')].find(o => { const r = o.getBoundingClientRect(); return ev.clientY < r.top + r.height / 2; }); lijst.insertBefore(rij, na || null); };
    const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); removeEventListener('pointercancel', up); rij.classList.remove('sleep'); sorteert = false; klaar(); };
    addEventListener('pointermove', mv); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  };

function tabMoetjes() {
  const f = S.mf, acts = zichtbaar(), kids = S.kids.filter(k => k.actief !== false), d = dagStr(), dk = dagkleuren();
  if (!acts.some(a => a.id === f.act)) f.act = acts[0]?.id || '';
  const lijst = S.moetjes.filter(m => (m.totDatum || m.datum) >= d).sort((a, b) => a.datum.localeCompare(b.datum)), oud = S.moetjes.length - lijst.length;
  P.innerHTML = `<div class="blok"><h2>Nieuw moetje</h2><div class="rij">
      <select data-f="act">${acts.map(a => `<option value="${a.id}" ${a.id === f.act ? 'selected' : ''}>${esc(a.plaatje)} ${esc(a.naam)}</option>`).join('')}</select>
      <select data-f="week"><option value="">Alleen vandaag</option><option value="1" ${f.week ? 'selected' : ''}>Deze hele week</option></select>
      <select data-f="groep"><option value="1">Hele groep</option><option value="" ${f.groep ? '' : 'selected'}>Kinderen kiezen…</option></select>
      <button class="pri" data-voegtoe>Toevoegen</button></div>
    ${f.groep ? '' : `<div class="tegels" style="margin-top:12px">${kids.map(k => `<div class="tegel${f.kids.includes(k.id) ? ' kies' : ''}" data-kies="${k.id}">${esc(k.symbool)} ${esc(k.naam)}</div>`).join('')}</div>`}
    <p class="zacht">Bij een weekmoetje slepen kinderen op het bord een dagkleur naar hun naamkaartje om in te plannen wanneer ze het doen: ${DAGNAMEN.map((n, i) => `<span style="background:${dk[i]};border-radius:99px;padding:1px 9px">${n}</span>`).join(' ')}</p></div>
    <div class="blok"><h2>Lopende moetjes</h2>${lijst.map(m => {
    const a = S.acts.find(x => x.id === m.activiteitId), wie = m.heleGroep ? kids : kids.filter(k => (m.kindIds || []).includes(k.id)), af = m.afgerond || [];
    return `<div class="arij" style="--kl:${a?.kleur || '#ccc'};flex-wrap:wrap" data-m="${m.id}"><span class="e">${esc(a?.plaatje || '❓')}</span><span class="n">${esc(a?.naam || 'Verwijderde activiteit')} <span class="zacht">· ${m.datum === (m.totDatum || m.datum) ? m.datum : m.datum + ' t/m ' + m.totDatum} · ${wie.filter(k => af.includes(k.id)).length}/${wie.length} klaar</span></span><button class="klein rood" data-weg>Verwijderen</button>
      <div class="rij" style="width:100%">${wie.map(k => `<button class="klein" data-vink="${k.id}" style="${af.includes(k.id) ? 'background:#c6f0d4' : ''}${m.planning?.[k.id] != null ? `;box-shadow:inset 0 -4px ${dk[m.planning[k.id]]}` : ''}">${af.includes(k.id) ? '✔' : '○'} ${esc(k.naam)}</button>`).join('')}</div></div>`;
  }).join('') || '<p class="zacht">Er zijn nu geen moetjes.</p>'}${oud ? `<button class="klein" data-oud>${oud} oude moetjes opruimen</button>` : ''}<p class="zacht">Tik op een naam om een moetje handmatig af te vinken.</p></div>`;
  P.onchange = e => { const k = e.target.dataset.f; if (!k) return; f[k] = k === 'act' ? e.target.value : !!e.target.value; tabMoetjes(); };
  P.onclick = e => {
    const t = e.target, rij = t.closest('[data-m]');
    if (t.dataset.kies) { f.kids = f.kids.includes(t.dataset.kies) ? f.kids.filter(x => x !== t.dataset.kies) : [...f.kids, t.dataset.kies]; tabMoetjes(); }
    else if (t.dataset.voegtoe != null) {
      if (!f.act) return toast('Kies een activiteit'); if (!f.groep && !f.kids.length) return toast('Kies een of meer kinderen');
      const vr = new Date(); vr.setDate(vr.getDate() - vandaagIdx() + 4);
      DB.put(K('moetjes/' + nieuwId()), { datum: d, totDatum: f.week && dagStr(vr) > d ? dagStr(vr) : d, activiteitId: f.act, heleGroep: f.groep, kindIds: f.groep ? [] : f.kids, afgerond: [], planning: {} });
      f.kids = []; toast('Moetje toegevoegd');
    }
    else if (t.dataset.oud != null) DB.batch(S.moetjes.filter(m => (m.totDatum || m.datum) < d).map(m => ({ p: K('moetjes/' + m.id), del: true })));
    else if (rij && t.dataset.weg != null) DB.del(K('moetjes/' + rij.dataset.m));
    else if (rij && t.dataset.vink) { const m = S.moetjes.find(x => x.id === rij.dataset.m), id = t.dataset.vink; DB.put(K('moetjes/' + m.id), { afgerond: (m.afgerond || []).includes(id) ? DB.remove(id) : DB.union(id) }); }
  };
}

// ---------- Overzicht ----------
function periode() {
  const o = S.ov, nu = new Date(); let van;
  if (o.periode === 'week') { van = new Date(nu); van.setDate(nu.getDate() - vandaagIdx()); }
  else if (o.periode === 'maand') van = new Date(nu.getFullYear(), nu.getMonth(), 1);
  else if (o.periode === 'jaar') van = new Date(nu.getMonth() >= 7 ? nu.getFullYear() : nu.getFullYear() - 1, 7, 1);
  else return [new Date(o.van + 'T00:00').getTime(), new Date(o.tot + 'T23:59:59').getTime()];
  van.setHours(0, 0, 0, 0); return [van.getTime(), Date.now()];
}
async function laadOv() {
  const [a, b] = periode(); S.ov.keuzes = null; renderTab();
  try { S.ov.keuzes = await DB.list(K('keuzes'), 'start', a, b); } catch (e) { S.ov.keuzes = []; toast('Laden mislukt: ' + e.message); }
  if (S.tab === 'overzicht') renderTab();
}
function tabOverzicht() {
  const o = S.ov, kids = S.kids.filter(k => k.actief !== false), ks = o.keuzes, [van, tot] = periode();
  const gebruikt = new Set([...zichtbaar().map(a => a.id), ...(ks || []).map(c => c.activiteitId)]), acts = S.acts.filter(a => gebruikt.has(a.id));
  const kop = `<div class="blok noprint"><div class="rij">
    <select data-o="periode">${[['week', 'Deze week'], ['maand', 'Deze maand'], ['jaar', 'Dit schooljaar'], ['eigen', 'Eigen periode']].map(([v, n]) => `<option value="${v}" ${o.periode === v ? 'selected' : ''}>${n}</option>`).join('')}</select>
    ${o.periode === 'eigen' ? `<input type="date" data-o="van" value="${o.van}"> t/m <input type="date" data-o="tot" value="${o.tot}">` : ''}
    <select data-o="weergave">${[['kind', 'Per kind'], ['act', 'Per activiteit'], ['samen', 'Wie speelt met wie']].map(([v, n]) => `<option value="${v}" ${o.weergave === v ? 'selected' : ''}>${n}</option>`).join('')}</select>
    ${o.weergave === 'kind' ? `<select data-o="kind"><option value="">Alle kinderen</option>${kids.map(k => `<option value="${k.id}" ${o.kind === k.id ? 'selected' : ''}>${esc(k.naam)}</option>`).join('')}</select>` : ''}
    <span style="flex:1"></span><button class="pri" data-print>🖨️ Afdrukken</button></div></div>`;
  P.onchange = e => { const k = e.target.dataset.o; if (!k) return; o[k] = e.target.value; ['periode', 'van', 'tot'].includes(k) ? laadOv() : renderTab(); };
  P.onclick = e => { if (e.target.dataset.print != null) print(); };
  if (!ks) { P.innerHTML = kop + '<div class="blok">Even laden…</div>'; return; }
  const tel = {}, min = {}, perAct = {}, groep = {}, samen = {};
  const duur = c => c.eind ? Math.min(c.eind - c.start, 2 * 3600e3) / 60000 : 0;
  for (const c of ks) {
    (tel[c.kindId] ||= {})[c.activiteitId] = (tel[c.kindId][c.activiteitId] || 0) + 1;
    (min[c.kindId] ||= {})[c.activiteitId] = (min[c.kindId][c.activiteitId] || 0) + duur(c);
    const p = perAct[c.activiteitId] ||= { n: 0, min: 0, kids: new Set() }; p.n++; p.min += duur(c); p.kids.add(c.kindId);
    (groep[c.rondeId + '|' + c.activiteitId] ||= new Set()).add(c.kindId);
  }
  for (const g of Object.values(groep)) { const a = [...g]; for (const x of a) for (const y of a) if (x !== y) (samen[x] ||= {})[y] = (samen[x][y] || 0) + 1; }
  const fmt = t => new Date(t).toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' });
  const kleur = (n, max) => n ? `background:rgba(91,141,239,${(.15 + .7 * n / max).toFixed(2)})` : '';
  const sym = k => k.foto ? '🙂' : esc(k.symbool);
  let h = `<div class="blok"><h2 class="printkop">${esc(S.klas.naam)}</h2><p class="zacht">${fmt(van)} t/m ${fmt(tot)} · ${ks.length} keuzes</p>`;
  if (o.weergave === 'kind' && o.kind) {
    const k = kids.find(x => x.id === o.kind), t = tel[k.id] || {}, max = Math.max(1, ...Object.values(t));
    const rij = [...acts].sort((a, b) => (t[b.id] || 0) - (t[a.id] || 0)), nooit = rij.filter(a => !t[a.id]);
    const maatjes = Object.entries(samen[k.id] || {}).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([id, n]) => { const m = S.kids.find(x => x.id === id); return m ? `${esc(m.naam)} (${n}×)` : ''; }).filter(Boolean);
    h += `<h2>${sym(k)} ${esc(k.naam)}</h2>${rij.map(a => `<div class="bar${t[a.id] ? '' : ' nul'}" style="--kl:${a.kleur}"><b>${esc(a.plaatje)} ${esc(a.naam)}</b><i style="width:${100 * (t[a.id] || 0) / max}%"></i><span>${t[a.id] || 0}× · ${Math.round(min[k.id]?.[a.id] || 0)} min</span></div>`).join('')}
      <p><b>Nog nooit gekozen:</b> ${nooit.map(a => esc(a.naam)).join(', ') || '–'}</p><p><b>Speelt het vaakst met:</b> ${maatjes.join(', ') || '–'}</p>`;
  } else if (o.weergave === 'kind') {
    const max = Math.max(1, ...Object.values(tel).flatMap(t => Object.values(t)));
    h += `<div class="scroll"><table class="heat"><tr><th class="k">Kind</th>${acts.map(a => `<th title="${esc(a.naam)}">${esc(a.plaatje)}<br><small>${esc(a.naam.slice(0, 5))}</small></th>`).join('')}<th>Totaal</th></tr>
      ${kids.map(k => { const t = tel[k.id] || {}; return `<tr><td class="k">${sym(k)} ${esc(k.naam)}</td>${acts.map(a => t[a.id] ? `<td style="${kleur(t[a.id], max)}">${t[a.id]}</td>` : '<td class="nul">·</td>').join('')}<td><b>${acts.reduce((s, a) => s + (t[a.id] || 0), 0)}</b></td></tr>`; }).join('')}</table></div>
      <p class="zacht">Een rood vakje (·) betekent: in deze periode nooit gekozen.</p>`;
  } else if (o.weergave === 'act') {
    const max = Math.max(1, ...acts.map(a => perAct[a.id]?.n || 0));
    h += [...acts].sort((a, b) => (perAct[b.id]?.n || 0) - (perAct[a.id]?.n || 0)).map(a => {
      const p = perAct[a.id] || { n: 0, min: 0, kids: new Set() }, nooit = kids.filter(k => !p.kids.has(k.id));
      return `<div class="bar${p.n ? '' : ' nul'}" style="--kl:${a.kleur}"><b>${esc(a.plaatje)} ${esc(a.naam)}</b><i style="width:${100 * p.n / max}%"></i><span>${p.n}× · ${p.kids.size} kinderen · gem. ${p.n ? Math.round(p.min / p.n) : 0} min</span></div><p class="zacht" style="margin:0 0 10px">Komt hier nooit: ${nooit.length === kids.length ? 'niemand is hier geweest' : nooit.map(k => esc(k.naam)).join(', ') || '–'}</p>`;
    }).join('');
  } else {
    const max = Math.max(1, ...Object.values(samen).flatMap(t => Object.values(t)));
    h += `<div class="scroll"><table class="heat"><tr><th class="k"></th>${kids.map(k => `<th title="${esc(k.naam)}">${sym(k)}<br><small>${esc(k.naam.slice(0, 4))}</small></th>`).join('')}</tr>
      ${kids.map(k => `<tr><td class="k">${sym(k)} ${esc(k.naam)}</td>${kids.map(m => k.id === m.id ? '<td style="background:#eee"></td>' : `<td style="${kleur(samen[k.id]?.[m.id], max)}">${samen[k.id]?.[m.id] || ''}</td>`).join('')}</tr>`).join('')}</table></div>
      <p class="zacht">Het getal is hoe vaak twee kinderen in dezelfde ronde in dezelfde hoek zaten.</p>`;
  }
  P.innerHTML = kop + h + '</div>';
}

  P.innerHTML = `<div class="blok"><h2>Klas</h2><div class="rij"><label>Naam <input data-i="naam" value="${esc(k.naam)}"></label></div>
      <p>${vink('geluid', k.geluid !== false, 'Geluidje bij een geslaagde keuze')}</p><p>${vink('toonTeller', k.toonTeller, 'Toon op elk kaartje hoe vaak het kind deze activiteit al koos')}</p>

    <div class="blok"><h2>Dit apparaat</h2><div class="rij"><button data-x="fs">⛶ Volledig scherm</button><button data-x="wissel">🚪 Andere klas kiezen</button>${LOKAAL ? '<button class="rood" data-x="wis">Probeerdata wissen</button>' : `<button data-x="uit">Uitloggen (${esc(S.user.email)})</button>`}</div></div>
    ${isBeheerder() ? '<div class="blok" id="beheer"><h2>Beheer</h2><p class="zacht">Even laden…</p></div>' : ''}`;

    const t = e.target;
    if (t.dataset.i) { const v = t.type === 'checkbox' ? t.checked : t.value.trim(); if (t.dataset.i === 'naam' && !v) return; DB.put(KLAS(), { [t.dataset.i]: v }); }
    else if (t.dataset.dk) { const n = [...dagkleuren()]; n[+t.dataset.dk] = t.value; DB.put(KLAS(), { dagkleuren: n }); }
    else if (t.id === 'i-imp' && t.files[0]) importeer(t.files[0]);
    else if (t.dataset.u) { const [uid, veld] = t.dataset.u.split('|'), rij = t.closest('[data-rij]'); DB.put((veld === 'inv' ? 'uitnodigingen/' : 'gebruikers/') + uid, veld === 'rol' ? { rol: t.value } : { klasIds: [...rij.querySelectorAll('input:checked')].map(c => c.value) }).then(() => toast('Opgeslagen'), x => toast(x.message)); }
  };
  P.onclick = async e => {
    const x = e.target.dataset.x; if (!x) return;
    if (x === 'fs') volledig();
    else if (x === 'pin') { const p = $('#i-pin').value.trim(); if (!/^\d{4,8}$/.test(p)) return toast('Een pincode heeft 4 tot 8 cijfers'); await DB.put(KLAS(), { pinHash: await hash(S.klasId + ':' + p) }); $('#i-pin').value = ''; toast('Pincode gewijzigd'); }
    else if (x === 'export') exporteer(); else if (x === 'demo') demo();
    else if (x === 'wissel') { stopSubs(); naLogin(true); }
    else if (x === 'uit') { if (confirm('Uitloggen op dit apparaat?')) fb.signOut(fb.auth); }
    else if (x === 'wis') { if (confirm('Alle probeerdata in deze browser wissen?')) { localStorage.removeItem('keuzebord_lokaal'); localStorage.removeItem('kb_klas'); LS.data = {}; location.reload(); } }
    else if (x === 'klas') { const n = $('#b-kn').value.trim(), p = $('#b-kp').value.trim(); if (!n || !/^\d{4,8}$/.test(p)) return toast('Vul een naam en een pincode (4-8 cijfers) in'); const id = nieuwId(); try { await maakKlas(id, n, p); toast('Klas aangemaakt'); beheer(); } catch (err) { toast(err.message); } }
    else if (x === 'nodig') {
      const em = $('#b-em').value.trim().toLowerCase(), ids = [...document.querySelectorAll('#b-nk input:checked')].map(c => c.value);
      if (!/^\S+@\S+\.\S+$/.test(em) || !ids.length) return toast('Vul een e-mailadres in en kies minstens één klas');
      try { await DB.put('uitnodigingen/' + em, { schoolId: S.ik.schoolId, klasIds: ids, rol: $('#b-rol').value }, false); toast('Gekoppeld. Je collega kan nu inloggen met dit e-mailadres.'); beheer(); } catch (err) { toast(err.message); }
    }
    else if (x === 'invweg') { await DB.del('uitnodigingen/' + e.target.dataset.id); beheer(); }
    else if (x === 'uweg') { if (confirm('Toegang van deze collega intrekken?')) { await DB.del('gebruikers/' + e.target.dataset.id); beheer(); } }
  };
  if (isBeheerder()) beheer();
}

        ${open.map(i => `<div class="arij" style="--kl:#fbd38d"><span class="n">${esc(i.id)} <span class="zacht">· nog niet ingelogd</span></span><button class="klein rood" data-x="invweg" data-id="${esc(i.id)}">Verwijderen</button></div>`).join('')}
        <h3>Collega koppelen</h3><div class="rij"><input id="b-em" type="email" placeholder="E-mailadres van je collega"><select id="b-rol"><option value="leerkracht">Leerkracht</option><option value="beheerder">Beheerder</option></select><span id="b-nk">${vinkjes([S.klasId])}</span><button class="pri" data-x="nodig">Koppelen</button></div>

    }
    el.innerHTML = h;
  } catch (e) { el.innerHTML = `<h2>Beheer</h2><p>Laden mislukt: ${esc(e.message)}</p>`; }

// ---------- export, import, demo ----------
async function exporteer() {
  const [kinderen, activiteiten, moetjes, keuzes, keuzeborden] = await Promise.all(['kinderen', 'activiteiten', 'moetjes', 'keuzes', 'keuzeborden'].map(c => DB.list(K(c))));
  const { pinHash, ...klas } = zonderId(S.klas);
  const blob = new Blob([JSON.stringify({ soort: 'keuzebord-backup', versie: 1, datum: new Date().toISOString(), klas, stand: zonderId(S.stand), kinderen, activiteiten, moetjes, keuzes, keuzeborden })], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `keuzebord-${S.klas.naam.replace(/[^\w-]+/g, '_')}-${dagStr()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function importeer(file) {
  try {
    const d = JSON.parse(await file.text());
    if (d.soort !== 'keuzebord-backup') throw new Error('Dit is geen back-up van het keuzebord');
    if (!confirm(`Back-up van "${d.klas?.naam}" (${d.kinderen?.length || 0} kinderen, ${d.keuzes?.length || 0} keuzes) in deze klas zetten? Bestaande gegevens met dezelfde id worden overschreven.`)) return;
    const ops = [{ p: KLAS(), d: d.klas || {} }, { p: K('bord/stand'), d: d.stand || { plaatsen: {}, rondeId: nieuwId() }, merge: false }];
    for (const c of ['kinderen', 'activiteiten', 'moetjes', 'keuzes', 'keuzeborden']) for (const x of d[c] || []) ops.push({ p: K(c + '/' + x.id), d: zonderId(x), merge: false });
    await DB.batch(ops); toast('Back-up teruggezet');
  } catch (e) { toast('Importeren mislukt: ' + e.message); }
}
async function demo() {
  if (!confirm('Demo-data laden? Er komen 24 fictieve kinderen bij, met ongeveer vier weken keuzegeschiedenis.')) return;
  toast('Demo-data wordt gemaakt…');
  const ops = [], kies1 = a => a[Math.floor(Math.random() * a.length)];
  const acts = S.acts.length ? zichtbaar() : STANDAARD.slice(0, 20).map((s, i) => ({ id: 'std' + i, plekken: s[2] }));
  if (!S.acts.length) { ops.push(...standaardOps(KLAS())); if (!S.klas.keuzebordId) ops.push({ p: KLAS(), d: { keuzebordId: 'standaard' } }); }
  const kids = 'Emma Noah Sem Julia Liam Mila Lucas Tess Finn Sara Daan Zoë Levi Nora Luuk Evi Milan Lotte Bram Saar Mees Fenna Jesse Yara'.split(' ').map((naam, i) => ({ id: 'demo' + i, naam, symbool: SYMBOLEN[i], teller: {}, fav: [kies1(acts).id, kies1(acts).id, kies1(acts).id], nooit: [kies1(acts).id, kies1(acts).id] }));
  let dagenTerug = 0, gedaan = 0;
  while (gedaan < 20 && dagenTerug < 60) {
    const dag = new Date(); dag.setDate(dag.getDate() - ++dagenTerug); if (dag.getDay() % 6 === 0) continue; gedaan++;
    for (const uur of [9, 13]) {
      const rondeId = nieuwId(), bezet = {};
      for (const k of [...kids].sort(() => Math.random() - .5)) {
        let a; for (let i = 0; i < 30 && !a; i++) { const c = Math.random() < .6 ? acts.find(x => x.id === kies1(k.fav)) : kies1(acts); if (c && !(k.nooit.includes(c.id) && !k.fav.includes(c.id)) && (bezet[c.id] || 0) < c.plekken) a = c; }
        if (!a) continue; bezet[a.id] = (bezet[a.id] || 0) + 1; k.teller[a.id] = (k.teller[a.id] || 0) + 1;
        const start = new Date(dag).setHours(uur, Math.floor(Math.random() * 6), 0, 0);
        ops.push({ p: K('keuzes/' + nieuwId()), d: { kindId: k.id, activiteitId: a.id, start, eind: start + (20 + Math.floor(Math.random() * 26)) * 60000, rondeId, datum: dagStr(start) }, merge: false });
      }
    }
  }
  for (const k of kids) ops.push({ p: K('kinderen/' + k.id), d: { naam: k.naam, symbool: k.symbool, foto: '', actief: true, teller: k.teller }, merge: false });
  const vr = new Date(); vr.setDate(vr.getDate() - vandaagIdx() + 4);
  ops.push({ p: K('moetjes/demo'), d: { datum: dagStr(), totDatum: dagStr(vr) > dagStr() ? dagStr(vr) : dagStr(), activiteitId: acts[4 % acts.length].id, heleGroep: false, kindIds: kids.slice(0, 8).map(k => k.id), afgerond: [], planning: {} }, merge: false });
  try { await DB.batch(ops); toast('Demo-data geladen 🎉'); zetTab('bord'); } catch (e) { toast('Mislukt: ' + e.message); }
}

start();
</script>
